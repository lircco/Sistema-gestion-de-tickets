services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "8000:8000"
      - "8081:8081"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    name: nginx-proxy
    driver: bridge
