services:
  caddy-proxy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "8081:8081"
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    command: >
      sh -c '
      if [ -z "$$DOMAIN_FRONTEND" ]; then export DOMAIN_FRONTEND="http://localhost"; fi;
      if [ -z "$$DOMAIN_BACKEND" ]; then export DOMAIN_BACKEND="http://localhost:8000"; fi;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
      '
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nginx-proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  nginx-proxy:
    name: nginx-proxy
    driver: bridge
